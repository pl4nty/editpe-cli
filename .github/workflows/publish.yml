name: Publish

on:
  workflow_run:
    branches:
      - main
    workflows:
      - Tests & Checks
    types:
      completed
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  statuses: write

jobs:

  publish:

    name: Publish
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          show-progress: false

      - name: Set up Rust toolchain
        uses: Systemcluster/actions@setup-rust-v0
        with:
          channel: stable
          cache-key-job: true

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Publish
        uses: Systemcluster/actions@release-crates-v0
        if: github.ref == 'refs/heads/main' && github.repository_owner == 'Systemcluster'
        with:
          crates-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          dry-run: ${{ !secrets.CARGO_REGISTRY_TOKEN }}
          tag-crate: editpe

  build:

    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: editpe-cli-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: editpe-cli-linux-arm64
            linker: gcc-aarch64-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: editpe-cli-windows-x64
            ext: .exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: editpe-cli-windows-arm64
            ext: .exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: editpe-cli-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: editpe-cli-macos-arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          show-progress: false

      - name: Install cross-compilation linker
        if: matrix.linker
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}

      - name: Set up Rust toolchain
        uses: Systemcluster/actions@setup-rust-v0
        with:
          channel: stable
          cache-key-job: true

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Configure linker
        if: matrix.linker
        run: |
          TARGET=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          LINKER_BIN=$(echo "${{ matrix.linker }}" | sed 's/^gcc-//')
          echo "CARGO_TARGET_${TARGET}_LINKER=${LINKER_BIN}-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin editpe-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/editpe-cli${{ matrix.ext }}
